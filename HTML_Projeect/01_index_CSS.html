     <section>
    <h2>Game  Feedback Form</h2>
    <form>
        <label>Your Name:</label><br>
        <input type="text"  placeholder="Enter your name"><br><br>

        <label>Favorite Game:</label><br>
        <input type="text" placeholder="e.g., PUBG, Fortnite, Call of duty warzone" id="Beste Game"><br><br>

        <input type="submit" value="Submit Feedback">

    </form>
</section>

<section>
    <h2>Create New Account</h2>
    <form>
        <label>Full Name:</label>
        <input type="text" placeholder="Enter your  full name" required><br><br>
        <label>Email Address:</label><br>
        <input type="email" placeholder="name@example.com" required><br><br>
        <label>Password:</label><br>
        <input type="password" placeholder="Create a Strong password" required><br><br>
        <input type="submit" value="Register Now">
    </form>
</section>

<section>
    <h2>Customer Satisfaction</h2>
    <form>
        <label>How did you find our website?</label><br>
        <select>
            <option value="google">Google Search</option>
            <option value="social">Social Media</option>
            <option value="friend">A Friend</option>
        </select><br><br>

        <label>Would you recommend us to a friend?</label><br>
        <input type="radio" id="yes" name="recommend" value="yes">
        <label for="yes">Yes</label>
        <input type="radio" id="no" name="recommend" value="no">
        <label for="no">NO</label><br><br>

            <label>Your Review / Suggestions:</label><br>
            <textarea rows="4" cols="40" placeholder="Write your feedback here..."></textarea><br><br>
            <input type="submit" value="Submit Survey">
    </form>
</section>

</body>
</html>
