<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Weather App</title>
    <link rel="stylesheet" href="../CSS_Project/style_26.css">
</head>
<body>
     <div class="weather-container">
         <h2>Weather App</h2>
         <input type="text" id="city-input" placeholder="Enter city name (e.g., Cairo)">
         <button id="search-btn">Search</button>

         <div id="weather-box" class="hidden">
             <h3 id="city-name"></h3>
             <p class="temp"><span id="temperature">0</span>C</p>
         </div>
     </div>
     <script src="../JS_Project/3_script.js"></script>
</body>
</html>
