<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pricing Table</title>
    <link rel="stylesheet" href="../CSS_Project/style_12.css">
</head>
<body>

<div class="pricing-container">
    <div class="price-card">
        <h3>Basic Plan</h3>
        <div class="price">$9/mo</div>
        <p>Limited features and 5 GB storage.</p>
        <button class="btn">Choose Plan</button>
    </div>
    <div class="price-card popular">
        <<div class="badge">Most Popular</div>
        <h3>Pro Plan</h3>
        <div class="price">$29/mo</div>
        <p>Full features, 50 GB storage, and 24/7 support.</p>
        <button class="btn">Choose Plan</button>
    </div>
</div>
</body>
</html>
