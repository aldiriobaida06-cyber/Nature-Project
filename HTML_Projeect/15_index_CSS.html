<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Chat App UI </title>
    <link rel="stylesheet" href="../CSS_Project/style_11.css">
</head>
<body>

<div class="chat-container">
    <div class="chat-header">Support Team</div>
    <div class="chat-messages">
        <div class="message incoming">Hello! How can I help you today?</div>
        <div class="message outgoing">Hi, I have a issue with account activation.</div>
        <div class="message incoming">Sure, please provide your email address.</div>
    </div>
    <div class="chat-input-area">
        <input type="text" placeholder="Type your message here...">
        <button>Send</button>
    </div>
</div>

</body>
</html>
