<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Product Card</title>
    <link rel="stylesheet" href="../CSS_Project/style_01.css">
</head>
<body>

<div class="cards-container">

    <div class="product-card">
        <img src="../fortnite.png" alt="Game">
        <h3>Fortnite V-Bucks</h3>
        <p>Price: $9.99</p>
        <button>Buy Now!</button>

    <div class="product-card">

        <div class="avatar"></div>
        <h2>My first name</h2>
        <p>I am learning user interface programming and website building.</p>
    </div>
</div>

</body>
</html>
